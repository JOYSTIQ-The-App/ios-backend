version: '3'

tasks:
  build:
    desc: Build the Docker containers.
    cmds:
      - docker-compose build
  
  up:
    desc: Run the Docker containers.
    cmds:
      - docker-compose up -d

  down:
    desc: Stop and remove the Docker containers.
    cmds:
      - docker-compose down

