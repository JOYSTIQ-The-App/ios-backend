version: '3'

tasks:
  start-postgres:
    desc: Start a new PostgreSQL Docker container
    cmds:
      - docker run --name db-beta -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 -d postgres

  init-db:
    desc: Create and initialize the joystiq database
    cmds:
      - docker exec -it db-beta psql -U postgres -c "CREATE DATABASE joystiq;"
      - docker exec -i db-beta psql -U postgres -d joystiq < ./01-schema.sql
    
  add-dummy:
    desc: Add dummy data to the database
    cmds:
      - docker exec -i db-beta psql -U postgres -d joystiq < ./02-dummy.sql

  all:
    desc: Start PostgreSQL container, initialize the database, and add dummy data 
    cmds:
      - task: init-db
      - task: add-dummy

  test:
    desc: Run the test.sql file on the postgres container
    cmds:
      - docker exec -i db-beta psql -U postgres -d joystiq < ./test.sql
  
  temp:
    desc: Run the test.sql file on the postgres container
    cmds:
      - docker exec -i db-beta psql -U postgres -d joystiq < ./temp.sql

  start:
    desc: Stop the postgres docker container
    cmds:
      - docker start db-beta

  stop:
    desc: Stop the postgres docker container
    cmds:
      - docker stop db-beta
  
  reset:
    desc: Stop and remove the postgres docker container
    cmds:
      - docker stop db-beta && docker rm db-beta
  